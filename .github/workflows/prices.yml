name: Daily prices

on:
  schedule:
    - cron: '30 20 * * 1-5'   # 화~토 05:30 KST (미국 장 마감 직후, 06:00 매크로 텔레그램 전)
    - cron: '30 21 * * 1-5'   # 화~토 06:30 KST — 11월 미국 서머타임 종료 후(장 마감 21:00 UTC) 대비 재실행
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'fetch_prices.py', '.github/workflows/prices.yml']

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance
      - run: python fetch_prices.py
      - name: Commit prices.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898989+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "chore: daily prices" && git pull --rebase && git push)
